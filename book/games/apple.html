<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>接蘋果</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfeaf7;font-family:"Noto Sans TC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);background:#fffc;border-radius:999px;padding:.4em 1.2em;font-size:clamp(16px,2.6vh,26px);color:#5a3b55;font-weight:700}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4vh,40px);color:#5a3b55;font-weight:800;text-shadow:0 2px 0 #fff;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="hud">接到 <span id="n">0</span> 顆・剩 <span id="t">20</span> 秒</div><div id="msg">左右移動，用蓋子接蘋果！</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,px=.5,apples=[],got=0,T=20,start=0,last=0,spawn=0,done=false,keys={};
function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}rs();addEventListener('resize',rs);
function mv(e){var r=c.getBoundingClientRect();px=Math.min(.95,Math.max(.05,(e.clientX-r.left)/r.width))}
c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);
addEventListener('keydown',function(e){keys[e.code]=1});addEventListener('keyup',function(e){keys[e.code]=0});
function draw(now){if(!start){start=now;last=now;setTimeout(function(){document.getElementById('msg').textContent=''},1200)}
 var dt=Math.min(.05,(now-last)/1000);last=now;var left=Math.max(0,T-(now-start)/1000);document.getElementById('t').textContent=Math.ceil(left);
 if(keys.ArrowLeft||keys.KeyA)px=Math.max(.05,px-dt*.9);if(keys.ArrowRight||keys.KeyD)px=Math.min(.95,px+dt*.9);
 x.fillStyle='#cfeaf7';x.fillRect(0,0,W,H);x.fillStyle='#7cc36a';x.fillRect(0,H*.86,W,H*.14);
 x.fillStyle='#4e8a3e';x.beginPath();x.ellipse(W*.5,H*.02,W*.55,H*.16,0,0,7);x.fill();
 spawn-=dt;if(left>0&&spawn<=0){apples.push({x:.08+Math.random()*.84,y:.1,v:.32+Math.random()*.25});spawn=.45+Math.random()*.35}
 var bw=W*.12,bx=px*W,by=H*.8;
 apples=apples.filter(function(a){a.y+=a.v*dt;var ax=a.x*W,ay=a.y*H;
  if(ay>by-H*.03&&ay<by+H*.03&&Math.abs(ax-bx)<bw*.55){got++;document.getElementById('n').textContent=got;return false}
  x.fillStyle='#d8332f';x.beginPath();x.arc(ax,ay,H*.025,0,7);x.fill();x.fillStyle='#3c7a2a';x.fillRect(ax-2,ay-H*.04,4,H*.016);return a.y<1.05});
 x.fillStyle='#b8452f';x.fillRect(bx-bw/2,by,bw,H*.07);x.fillStyle='#b69ad6';x.fillRect(bx-bw/2,by,bw*.12,H*.07);x.fillRect(bx+bw*.38,by,bw*.12,H*.07);
 x.save();x.translate(bx,by);x.rotate(-.5);x.fillStyle='#c9513a';x.fillRect(-bw/2,-H*.03,bw,H*.03);x.restore();
 x.fillStyle='#fff';x.beginPath();x.arc(bx-bw*.15,by+H*.012,H*.008,0,7);x.arc(bx+bw*.15,by+H*.012,H*.008,0,7);x.fill();
 if(left<=0&&!done){done=true;document.getElementById('msg').textContent='接到 '+got+' 顆！';
  parent.postMessage({type:'larch:set',name:'apples',value:got},'*');
  setTimeout(function(){parent.postMessage({type:'larch:complete',result:'done',payload:{apples:got}},'*')},1200)}
 if(!done||apples.length)requestAnimationFrame(draw)}
requestAnimationFrame(draw);parent.postMessage({type:'larch:ready'},'*');
</script></body></html>
